name: Render Short

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create output folder
        run: mkdir -p out

      - name: Render test video
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:d=6:r=30" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            out/short.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: short-render
          path: out/short.mp4
          retention-days: 7
